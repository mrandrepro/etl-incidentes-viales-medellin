<svg width="680" height="620" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!-- fondo -->
  <rect width="680" height="620" fill="#ffffff"/>

  <!-- fact_incidente -->
  <rect x="215" y="230" width="250" height="160" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <rect x="215" y="230" width="250" height="30" rx="8" fill="#D85A30"/>
  <rect x="215" y="248" width="250" height="12" fill="#D85A30"/>
  <text x="340" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">fact_incidente</text>
  <line x1="215" y1="268" x2="465" y2="268" stroke="#993C1D" stroke-width="0.8"/>
  <text x="230" y="284" font-size="11" fill="#4A1B0C">sk_incidente</text><text x="458" y="284" text-anchor="end" font-size="11" fill="#993C1D">PK</text>
  <text x="230" y="300" font-size="11" fill="#4A1B0C">sk_tiempo</text><text x="458" y="300" text-anchor="end" font-size="11" fill="#993C1D">FK</text>
  <text x="230" y="316" font-size="11" fill="#4A1B0C">sk_ubicacion</text><text x="458" y="316" text-anchor="end" font-size="11" fill="#993C1D">FK</text>
  <text x="230" y="332" font-size="11" fill="#4A1B0C">sk_accidente</text><text x="458" y="332" text-anchor="end" font-size="11" fill="#993C1D">FK</text>
  <text x="230" y="348" font-size="11" fill="#4A1B0C">expediente</text>
  <text x="230" y="364" font-size="11" fill="#4A1B0C">nro_radicado</text>

  <!-- dim_tiempo -->
  <rect x="215" y="20" width="250" height="140" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <rect x="215" y="20" width="250" height="30" rx="8" fill="#1D9E75"/>
  <rect x="215" y="38" width="250" height="12" fill="#1D9E75"/>
  <text x="340" y="40" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">dim_tiempo</text>
  <line x1="215" y1="58" x2="465" y2="58" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="230" y="74" font-size="11" fill="#04342C">sk_tiempo</text><text x="458" y="74" text-anchor="end" font-size="11" fill="#0F6E56">PK</text>
  <text x="230" y="90" font-size="11" fill="#04342C">fecha_accidente</text><text x="458" y="90" text-anchor="end" font-size="11" fill="#888780">DATE</text>
  <text x="230" y="106" font-size="11" fill="#04342C">anio</text><text x="458" y="106" text-anchor="end" font-size="11" fill="#888780">INT</text>
  <text x="230" y="122" font-size="11" fill="#04342C">mes</text><text x="458" y="122" text-anchor="end" font-size="11" fill="#888780">INT</text>

  <!-- dim_ubicacion -->
  <rect x="20" y="350" width="240" height="200" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <rect x="20" y="350" width="240" height="30" rx="8" fill="#7F77DD"/>
  <rect x="20" y="368" width="240" height="12" fill="#7F77DD"/>
  <text x="140" y="370" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">dim_ubicacion</text>
  <line x1="20" y1="388" x2="260" y2="388" stroke="#534AB7" stroke-width="0.8"/>
  <text x="35" y="404" font-size="11" fill="#26215C">sk_ubicacion</text><text x="253" y="404" text-anchor="end" font-size="11" fill="#534AB7">PK</text>
  <text x="35" y="420" font-size="11" fill="#26215C">barrio</text><text x="253" y="420" text-anchor="end" font-size="11" fill="#888780">VARCHAR</text>
  <text x="35" y="436" font-size="11" fill="#26215C">comuna</text><text x="253" y="436" text-anchor="end" font-size="11" fill="#888780">VARCHAR</text>
  <text x="35" y="452" font-size="11" fill="#26215C">num_comuna</text><text x="253" y="452" text-anchor="end" font-size="11" fill="#888780">VARCHAR</text>
  <text x="35" y="468" font-size="11" fill="#26215C">direccion</text><text x="253" y="468" text-anchor="end" font-size="11" fill="#888780">VARCHAR</text>
  <text x="35" y="484" font-size="11" fill="#26215C">x / y</text><text x="253" y="484" text-anchor="end" font-size="11" fill="#888780">FLOAT</text>

  <!-- dim_accidente -->
  <rect x="420" y="350" width="240" height="160" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <rect x="420" y="350" width="240" height="30" rx="8" fill="#378ADD"/>
  <rect x="420" y="368" width="240" height="12" fill="#378ADD"/>
  <text x="540" y="370" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">dim_accidente</text>
  <line x1="420" y1="388" x2="660" y2="388" stroke="#185FA5" stroke-width="0.8"/>
  <text x="435" y="404" font-size="11" fill="#042C53">sk_accidente</text><text x="653" y="404" text-anchor="end" font-size="11" fill="#185FA5">PK</text>
  <text x="435" y="420" font-size="11" fill="#042C53">clase_accidente</text><text x="653" y="420" text-anchor="end" font-size="11" fill="#888780">VARCHAR</text>
  <text x="435" y="436" font-size="11" fill="#042C53">gravedad_accidente</text><text x="653" y="436" text-anchor="end" font-size="11" fill="#888780">VARCHAR</text>
  <text x="435" y="452" font-size="11" fill="#042C53">diseno_via</text><text x="653" y="452" text-anchor="end" font-size="11" fill="#888780">VARCHAR</text>

  <!-- Flecha dim_tiempo → fact -->
  <line x1="340" y1="160" x2="340" y2="228" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Flecha dim_ubicacion → fact -->
  <polyline points="260,450 290,450 290,340 215,340" fill="none" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Flecha dim_accidente → fact -->
  <polyline points="420,430 390,430 390,340 465,340" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Leyenda grano -->
  <rect x="40" y="568" width="600" height="34" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="340" y="589" text-anchor="middle" font-size="11" fill="#5F5E5A">Grano: una fila por incidente vial registrado, identificado por expediente, fecha y ubicacion</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
